services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casadedavin
      POSTGRES_USER: davin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davin -d casadedavin"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: sh -c "npx tsx db/migrate.ts"
    environment:
      DATABASE_URL: postgresql://davin:${POSTGRES_PASSWORD:-localdev}@db:5432/casadedavin
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://davin:${POSTGRES_PASSWORD:-localdev}@db:5432/casadedavin
      NODE_ENV: production
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
